name: Validate Problem Bank

on:
  push:
    branches: [main, master]
    paths:
      - 'content/problems/**'
      - 'scripts/validate_problems.py'
  pull_request:
    branches: [main, master]
    paths:
      - 'content/problems/**'
      - 'scripts/validate_problems.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Problem Bank Test Harness
        run: |
          python scripts/validate_problems.py
