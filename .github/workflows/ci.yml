name: Ready2Code Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Lint, Pytest & Problem Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest pytest-asyncio

      - name: Run Pytest Test Suite (28 tests)
        run: |
          python -m pytest api/tests/ -v

      - name: Validate Problem Bank Integrity (100 problems)
        run: |
          python scripts/validate_problems.py
          python content/scripts/validate_content.py

  frontend-build:
    name: Frontend Lint, Type-Check, Tests & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm --prefix web ci

      - name: Run ESLint
        run: |
          npm --prefix web run lint

      - name: Run TypeScript Type-Check
        run: |
          npm --prefix web run type-check

      - name: Run Frontend Unit Tests
        run: |
          npm --prefix web test

      - name: Production Next.js Build
        run: |
          npm --prefix web run build

  e2e-playwright:
    name: Playwright E2E Tests
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Seed Local SQLite Database
        run: |
          python api/scripts/seed.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies & Playwright
        run: |
          npm --prefix web ci
          npx playwright install --with-deps chromium

      - name: Build Next.js Application
        run: |
          npm --prefix web run build

      - name: Start FastAPI Background Service
        run: |
          nohup python -m uvicorn app.main:app --app-dir api --port 8000 > api.log 2>&1 &
          sleep 3

      - name: Start Next.js Background Service
        run: |
          nohup npm --prefix web run start > web.log 2>&1 &
          sleep 5

      - name: Run Playwright E2E Tests
        run: |
          npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
